global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ============================================================
# Frontend: nơi tiếp nhận request từ client
# ============================================================
frontend http_front
    bind *:80
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy-combined.pem

    # ============================================================
    # BẢO MẬT 1 - SSL/TLS TERMINATION
    # Lưu ý: KHÔNG ép redirect http->https ở đây, vì cổng 80 còn được
    # WAF dùng BACKEND=https://haproxy-lb:443 nên cả hai tầng proxy
    # đều giao tiếp bằng HTTPS. Cổng 80 vẫn giữ để kiểm tra HAProxy
    # trực tiếp qua HTTP; luồng qua WAF dùng cổng HTTPS 8445 ở phía host.
    # ============================================================

    # ============================================================
    # BẢO MẬT 2 - RATE LIMITING (chống DDoS/flooding cơ bản)
    # Theo dõi số request/10 giây theo từng địa chỉ IP nguồn, dùng
    # bảng lưu trạng thái (stick-table) ngay trong bộ nhớ HAProxy.
    # Nếu 1 IP vượt quá 20 request trong 10 giây gần nhất, các request
    # tiếp theo của IP đó sẽ bị từ chối với mã lỗi 429 (Too Many
    # Requests) cho đến khi tốc độ giảm trở lại dưới ngưỡng.
    # ============================================================
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }

    default_backend backend_servers

# ============================================================
# Backend: nhóm server thực tế + thuật toán cân bằng tải
# ============================================================
backend backend_servers

    # --- Mặc định: ROUND ROBIN ---
    balance roundrobin

    # --- Để test LEAST CONNECTIONS: comment dòng trên, mở dòng dưới ---
    # balance leastconn

    # --- Để test SOURCE (tương đương IP Hash của Nginx) ---
    # balance source

    # --- Để test URI (băm theo đường dẫn URL, hữu ích cho cache) ---
    # balance uri

    # "check" bật health check chủ động (active health check) - HAProxy tự
    # gửi kết nối TCP kiểm tra định kỳ đến từng server, KHÔNG cần đợi có
    # request thật của người dùng bị lỗi mới phát hiện (khác với Nginx OSS
    # mặc định chỉ có passive health check dựa trên request thật).
    server backend1 backend1:3000 check
    server backend2 backend2:3000 check
    server backend3 backend3:3000 check

    # --- Để test WEIGHTED ROUND ROBIN: comment 3 dòng trên, dùng 3 dòng dưới ---
    # server backend1 backend1:3000 check weight 3
    # server backend2 backend2:3000 check weight 2
    # server backend3 backend3:3000 check weight 1

    # --- Để bật health check ở tầng ứng dụng (HTTP) thay vì chỉ TCP ---
    # option httpchk GET /
    # Có thể tinh chỉnh tần suất/ngưỡng phát hiện lỗi, ví dụ:
    # server backend1 backend1:3000 check inter 2000 rise 2 fall 3

# ============================================================
# Stats Dashboard: giao diện trực quan xem tình trạng backend
# Truy cập tại: http://localhost:8404/stats
# ============================================================
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats auth admin:Demo@2026

