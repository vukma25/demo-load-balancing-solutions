load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 1024;
}

http {
    # ============================================================
    # GeoIP2: tra cứu quốc gia từ địa chỉ IP
    # Lưu ý: dùng $http_x_forwarded_for thay vì $remote_addr, vì trong
    # môi trường demo local, IP kết nối thật luôn là IP nội bộ Docker -
    # không mang ý nghĩa địa lý. Script loadtest-hourly.js sẽ tự gán IP
    # giả lập vào header X-Forwarded-For để mô phỏng client thật.
    # Trong triển khai thực tế (production), sẽ dùng $remote_addr trực tiếp.
    # ============================================================
    geoip2 /etc/nginx/geo/GeoLite2-Country.mmdb {
        $geoip2_country_code default=XX source=$http_x_forwarded_for country iso_code;
    }

    # ============================================================
    # Bước 1 (GTM): ánh xạ quốc gia -> khu vực (Asia / Europe)
    # ============================================================
    map $geoip2_country_code $region {
        default        europe;   # mặc định các quốc gia còn lại về châu Âu

        # Châu Á
        VN asia;
        JP asia;
        KR asia;
        CN asia;
        SG asia;
        TH asia;
        ID asia;
        PH asia;
        IN asia;
        MY asia;
        HK asia;
        TW asia;

        # Châu Âu (liệt kê tường minh cho rõ ràng, dù đã là default)
        GB europe;
        DE europe;
        FR europe;
        ES europe;
        IT europe;
        NL europe;
        PL europe;
        SE europe;
        BE europe;
        PT europe;
    }

    # ============================================================
    # Bước 2: ánh xạ khu vực -> địa chỉ cụm K8s tương ứng (qua NodePort)
    # "minikube" là tên container Minikube tạo ra khi dùng driver=docker,
    # có thể phân giải trực tiếp qua DNS nội bộ của Docker (cùng network).
    # ============================================================
    map $region $region_target {
        asia   "minikube:30080";
        europe "minikube:30081";
    }

    # Cần resolver để Nginx phân giải tên "minikube" tại thời điểm chạy
    # (bắt buộc khi dùng biến trong proxy_pass)
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;

        location / {
            # Trả kèm thông tin định tuyến trong header - hữu ích để debug
            # và để loadtest-hourly.js đọc lại nhằm thống kê độ chính xác định tuyến
            add_header X-Detected-Country $geoip2_country_code always;
            add_header X-Routed-Region $region always;

            set $target http://$region_target;
            proxy_pass $target;
            proxy_set_header Host $host;
        }

        location /router-health {
            return 200 "global router is up\n";
            add_header Content-Type text/plain;
        }
    }
}
