load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 1024;
}

http {
    # X-Forwarded-For có thể chứa nhiều địa chỉ sau khi request đi qua WAF.
    # GeoIP2 và rate limiting chỉ cần IP client đầu tiên, không phải IP của
    # các proxy trung gian.
    map $http_x_forwarded_for $client_ip {
        "~^\s*([^, ]+)" $1;
        default       $remote_addr;
    }

    # ============================================================
    # GeoIP2: tra cứu quốc gia từ địa chỉ IP
    # Lưu ý: dùng $http_x_forwarded_for thay vì $remote_addr, vì trong
    # môi trường demo local, IP kết nối thật luôn là IP nội bộ Docker -
    # không mang ý nghĩa địa lý. Script loadtest-hourly.js sẽ tự gán IP
    # giả lập vào header X-Forwarded-For để mô phỏng client thật.
    # Trong triển khai thực tế (production), sẽ dùng $remote_addr trực tiếp.
    # ============================================================
    geoip2 /etc/nginx/geo/GeoLite2-Country.mmdb {
        $geoip2_country_code default=XX source=$client_ip country iso_code;
    }

    # ============================================================
    # Bước 1 (GTM): ánh xạ quốc gia -> khu vực (Asia / Europe)
    # ============================================================
    map $geoip2_country_code $region {
        default        europe;   # mặc định các quốc gia còn lại về châu Âu

        # Châu Á
        VN asia;
        JP asia;
        KR asia;
        CN asia;
        SG asia;
        TH asia;
        ID asia;
        PH asia;
        IN asia;
        MY asia;
        HK asia;
        TW asia;

        # Châu Âu (liệt kê tường minh cho rõ ràng, dù đã là default)
        GB europe;
        DE europe;
        FR europe;
        ES europe;
        IT europe;
        NL europe;
        PL europe;
        SE europe;
        BE europe;
        PT europe;
    }

    # ============================================================
    # Bước 2: ánh xạ khu vực -> HTTPS NodePort của ingress-nginx.
    # Ingress sẽ terminate TLS rồi chuyển tiếp HTTP đến Service.
    # "minikube" là tên container Minikube tạo ra khi dùng driver=docker,
    # có thể phân giải trực tiếp qua DNS nội bộ của Docker (cùng network).
    # ============================================================
    map $region $region_target {
        asia   "minikube:31306";
        europe "minikube:31306";
    }

    # Host dùng để ingress-nginx chọn đúng rule theo vùng và để TLS SNI
    # khớp với certificate của Ingress.
    map $region $region_host {
        asia   asia.game.local;
        europe europe.game.local;
    }

    # ============================================================
    # BẢO MẬT 3 - GEO-BLOCKING (mở rộng từ GeoIP2 đã có sẵn)
    # Tận dụng lại đúng kết quả tra cứu $geoip2_country_code ở trên,
    # nhưng thay vì chỉ dùng để ĐỊNH TUYẾN, giờ dùng thêm để CHẶN HẲN.
    #
    # Ví dụ áp dụng: chặn các request không xác định được quốc gia
    # nguồn gốc (mã "XX" - giá trị default khi GeoIP2 không tra được,
    # thường gặp ở traffic giả mạo IP, bot quét, hoặc lỗi cấu hình
    # proxy phía client) - đây là quy tắc trung lập, không nhắm vào
    # quốc gia cụ thể nào, phù hợp làm ví dụ minh hoạ cho báo cáo.
    #
    # Muốn chặn thêm quốc gia cụ thể theo yêu cầu nghiệp vụ, chỉ cần
    # thêm dòng "MÃ_QUỐC_GIA 1;" vào bên dưới.
    # ============================================================
    map $geoip2_country_code $is_blocked_country {
        default   0;
        XX        1;   # Không xác định được quốc gia nguồn -> chặn
        # KP      1;   # Ví dụ: bỏ comment + thêm mã quốc gia muốn chặn
    }

    # ============================================================
    # BẢO MẬT 2 - RATE LIMITING (chống DDoS/flooding cơ bản)
    # Giới hạn 10 request/giây cho mỗi địa chỉ IP (khoá theo header
    # X-Forwarded-For, cùng nguồn dữ liệu với GeoIP2 ở trên, vì lý do
    # tương tự: $remote_addr trong demo local không có ý nghĩa).
    # burst=20 cho phép v.ượt ngắn hạn tối đa 20 request xếp hàng chờ
    # trước khi thực sự từ chối, tránh chặn nhầm traffic hợp lệ có
    # tính "dồn cục" tự nhiên.
    # ============================================================
    limit_req_zone $client_ip zone=router_limit:10m rate=2r/s;

    # Cần resolver để Nginx phân giải tên "minikube" tại thời điểm chạy
    # (bắt buộc khi dùng biến trong proxy_pass)
    resolver 127.0.0.11 valid=30s;

    # ============================================================
    # BẢO MẬT 1 - SSL/TLS TERMINATION
    # Lưu ý: cổng 80 KHÔNG ép chuyển hướng sang HTTPS (khác với demo
    # HAProxy), vì cổng 80 của Global Router còn được WAF (container
    # riêng) gọi vào trực tiếp - nếu ép redirect, WAF sẽ chỉ nhận được
    # lệnh "chuyển hướng" thay vì nội dung thật, làm gãy luồng WAF ->
    # Router. Do đó cả 2 cổng cùng phục vụ song song: dùng cổng 443
    # khi muốn tự kiểm chứng riêng phần SSL/TLS Termination, dùng cổng
    # 80 (qua WAF ở cổng ngoài 9082) khi muốn kiểm chứng lớp WAF.
    # ============================================================
    server {
        listen 80;

        location / {
            if ($is_blocked_country) {
                return 403 "Access denied: country not allowed\n";
            }

            limit_req zone=router_limit burst=20 nodelay;
            limit_req_status 429;

            add_header X-Detected-Country $geoip2_country_code always;
            add_header X-Routed-Region $region always;

            set $target https://$region_target;
            proxy_pass $target;
            proxy_ssl_server_name on;
            proxy_ssl_name $region_host;
            proxy_ssl_verify off;
            proxy_set_header Host $region_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /router-health {
            return 200 "global router is up\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            if ($is_blocked_country) {
                return 403 "Access denied: country not allowed\n";
            }

            limit_req zone=router_limit burst=20 nodelay;
            limit_req_status 429;

            # Trả kèm thông tin định tuyến trong header - hữu ích để debug
            # và để loadtest-hourly.js đọc lại nhằm thống kê độ chính xác định tuyến
            add_header X-Detected-Country $geoip2_country_code always;
            add_header X-Routed-Region $region always;

            set $target https://$region_target;
            proxy_pass $target;
            proxy_ssl_server_name on;
            proxy_ssl_name $region_host;
            proxy_ssl_verify off;
            proxy_set_header Host $region_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /router-health {
            return 200 "global router is up\n";
            add_header Content-Type text/plain;
        }
    }
}
