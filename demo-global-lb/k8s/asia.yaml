# ============================================================
# CỤM CHÂU Á - namespace asia-cluster
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: asia-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-backend
  namespace: asia-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-backend
  template:
    metadata:
      labels:
        app: game-backend
    spec:
      containers:
        - name: game-backend
          image: game-server:latest
          imagePullPolicy: Never   # dùng image build sẵn trong Minikube, không kéo từ registry
          ports:
            - containerPort: 3000
          env:
            - name: REGION
              value: "Asia"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---

apiVersion: v1
kind: Service
metadata:
  name: game-backend-svc
  namespace: asia-cluster
spec:
  type: ClusterIP
  selector:
    app: game-backend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-backend-ingress
  namespace: asia-cluster
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - asia.game.local
      secretName: asia-game-tls
  rules:
    - host: asia.game.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-backend-svc
                port:
                  number: 80
---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-backend-hpa
  namespace: asia-cluster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # Rút ngắn thời gian chờ so với mặc định (mặc định scale down phải chờ 5 phút)
    # để demo trong thời gian ngắn vẫn quan sát được hành vi scale down.
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
